// Yuushya Townscape - Minecraft 1.21.11 / Fabric
//
// 这是一个独立构建（不在根 settings.gradle 中），因为 1.21.11 需要 Loom 1.18.x + Gradle 9.7，
// 而根工程其它版本共用 Loom 1.6。
//
// 构建要求：用 JDK 25 启动 Gradle（Loom 1.18 的最低要求），编译目标仍是 Java 21。
//   cd 1.21.11 && JAVA_HOME=<jdk25> ./gradlew build
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated true
        }
        server {
            server()
            ideConfigGenerated true
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly 'org.jetbrains:annotations:24.1.0'
}

def replaceProperties = [
        mod_name       : project.mod_name,
        mod_version    : project.mod_version,
        mod_homepage   : project.mod_homepage,
        mod_source     : project.mod_source,
        mod_credits    : project.mod_credits,
        mod_authors    : project.mod_authors,
        mod_description: project.mod_description,
        mod_licence    : project.mod_licence,
        group          : project.maven_group
]

processResources {
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from("../Terms_yuushya_user.md")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
    repositories {
    }
}
